<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Help — Student Notes Portal</title>
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="page-app">
  <div class="top-bar">
    <a class="nav-back" href="courses.html">&larr; Back</a>
    <div class="nav-title">Help</div>
    <span class="nav-spacer" aria-hidden="true"></span>
  </div>

  <div class="help-wrap">
    <p class="help-intro">Running into a problem with the portal? Pick what's wrong below.</p>

    <div class="help-item">
      <div class="help-question">Can't find your subject?</div>
      <button class="btn-dark-pill help-report-btn" type="button" data-issue="Can't find your subject">Tell the admins</button>
    </div>

    <div class="help-item">
      <div class="help-question">Subject files not visible?</div>
      <button class="btn-dark-pill help-report-btn" type="button" data-issue="Subject files not visible">Tell the admins</button>
    </div>

    <div class="help-item">
      <div class="help-question">A file won't download?</div>
      <button class="btn-dark-pill help-report-btn" type="button" data-issue="A file won't download">Tell the admins</button>
    </div>

    <div class="help-item">
      <div class="help-question">Found a mistake in a subject list?</div>
      <button class="btn-dark-pill help-report-btn" type="button" data-issue="Found a mistake in a subject list">Tell the admins</button>
    </div>
  </div>

  <script src="assets/js/help.js"></script>
</body>
</html>
